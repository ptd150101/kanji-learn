name: Add iPhone app icon

on:
  push:
    branches:
      - add-pwa-app-icon

permissions:
  contents: write

jobs:
  add-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: add-pwa-app-icon
          fetch-depth: 0

      - name: Write app icon and wire it into the page
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apple-touch-icon.b64 <<'EOF'

EOF
          base64 -d /tmp/apple-touch-icon.b64 > apple-touch-icon.png
          python - <<'PY'
          from pathlib import Path
          import struct

          png = Path('apple-touch-icon.png').read_bytes()
          if png[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Invalid PNG signature')
          w, h = struct.unpack('>II', png[16:24])
          if (w, h) != (180, 180):
              raise SystemExit(f'Unexpected icon size: {w}x{h}')

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          link = '<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">'
          if link not in text:
              needle = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
              if needle not in text:
                  raise SystemExit('Viewport marker not found')
              text = text.replace(needle, needle + '\n' + link, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit app icon changes
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/add-app-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html apple-touch-icon.png .github/workflows/add-app-icon.yml
          git diff --cached --name-only
          git commit -m 'Add iPhone Home Screen app icon'
          git push origin HEAD:add-pwa-app-icon
