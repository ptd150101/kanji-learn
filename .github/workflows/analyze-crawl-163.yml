a":["おそい","とおい","おもい","くらい"],"s":"この荷物はとても重いです。"},{"id":"349094","u":"資料","a":["じりょ","じりょう","しりょ","しりょう"],"s":"じゅぎょうの資料をコピーしました。"},{"id":"348748","u":"作り方","a":["つくりかた","つくりほうが","つくりまえ","つくりがた"],"s":"この料理は作り方が簡単です。"},{"id":"348770","u":"青い","a":["あおい","しろい","あかい","くろい"],"s":"青い空がとてもきれいです。"},{"id":"348800","u":"運転","a":["はこてん","うんりん","はこりん","うんてん"],"s":"彼はタクシーの運転をしています。"},{"id":"348975","u":"ひとり親","a":["ひとりしん","ひとりし","ひとりおや","ひとりしんせつ"],"s":"彼はひとり親かていでそだちました。"},{"id":"349097","u":"小林","a":["こはやし","こばやし","おばやし","こりん"],"s":"近くの小林さんをたずねました."},{"id":"349012","u":"知らない","a":["わからない","いらない","しらない","ちらない"],"s":"むずかしいことは何も知らないです。"},{"id":"348968","u":"真実","a":["まじつ","しんじつ","しんじち","まじち"],"s":"彼はついに真実を話しました。"},{"id":"348872","u":"決定","a":["けって","けってい","けいってい","げってい"],"s":"かいぎで新しいルールが決定しました。"},{"id":"349077","u":"羽毛","a":["うもう","うけ","はけ","はもう"],"s":"このまくらは羽毛を使っています。"},{"id":"348772","u":"両替","a":["りょうけ","りゅうがえ","りょうがえ","りゅうけ"],"s":"ぎんこうで両替をしました。"},{"id":"348842","u":"近い","a":["ちかい","はやい","おそい","とおい"],"s":"私の家は駅から近いです。"},{"id":"349084","u":"冷えます","a":["さめます","きえます","ひえます","つめます"],"s":"夜になるときゅうに足が冷えます。"},{"id":"348753","u":"歌手","a":["かす","かしゅ","かじゅ","がしゅ"],"s":"彼は歌手になりたいと言っています。"},{"id":"348811","u":"家族","a":["いえぞく","かぞぐ","かぞく","いえぞぐ"],"s":"私は５人家族です。"}]''')
          def norm(s): return unicodedata.normalize('NFKC', s or '').replace(' ','')
          def hira(s):
              out=[]
              for ch in norm(s):
                  cp=ord(ch); out.append(chr(cp-0x60) if 0x30A1<=cp<=0x30F6 else ch)
              return ''.join(out)
          krx=re.compile(r'[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]')
          def sig(s): return ''.join(krx.findall(s or ''))
          db=sqlite3.connect('data/kanji_vocab.sqlite'); db.row_factory=sqlite3.Row
          out=[]
          for q in MINI:
              u=norm(q['u']); answers=[hira(x) for x in q['a']]
              exact=[]
              for r in db.execute('SELECT * FROM vocab WHERE normalized_word=?',(u,)):
                  accepted={r['normalized_reading']}
                  accepted.update(x[0] for x in db.execute('SELECT normalized_reading FROM vocab_reading_aliases WHERE vocab_id=?',(r['id'],)))
                  exact.append(dict(id=r['id'],word=r['word'],reading=r['reading'],meaning=r['meaning_vi'],level=r['level'],reading_in_answers=bool(accepted.intersection(answers))))
              sent=[]
              for r in db.execute('SELECT * FROM vocab'):
                  if r['word'] and r['word'] in q['s']:
                      accepted={r['normalized_reading']}
                      accepted.update(x[0] for x in db.execute('SELECT normalized_reading FROM vocab_reading_aliases WHERE vocab_id=?',(r['id'],)))
                      if accepted.intersection(answers):
                          sent.append(dict(id=r['id'],word=r['word'],reading=r['reading'],meaning=r['meaning_vi'],level=r['level']))
              same_sig=[]
              usig=sig(u)
              if usig:
                  for r in db.execute('SELECT * FROM vocab'):
                      if sig(r['word'])==usig:
                          same_sig.append(dict(id=r['id'],word=r['word'],reading=r['reading'],meaning=r['meaning_vi'],level=r['level']))
              out.append({**q,'answers_norm':answers,'exact':exact,'sentence_matches':sent[:20],'same_kanji_signature':same_sig[:30]})
          pathlib.Path('.tmp').mkdir(exist_ok=True)
          pathlib.Path('.tmp/crawl-db-analysis.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('questions',len(out),'exact_word',sum(bool(x['exact']) for x in out),'exact_word_reading',sum(any(y['reading_in_answers'] for y in x['exact']) for x in out),'sentence_match',sum(bool(x['sentence_matches']) for x in out))
