name: Analyze N4 crawl candidates
on:
  push:
    branches: [feat/n4-crawl-topics-163]
    paths:
      - 'analysis/crawl_candidates_163.tsv'
      - '.github/workflows/analyze-n4-crawl-candidates.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare candidates with current website vocab
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          K=re.compile(r'[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]')
          def sig(s): return ''.join(K.findall(s or ''))
          def pref(a,b):
            n=0
            for x,y in zip(a,b):
              if x!=y: break
              n+=1
            return n
          n4=json.loads(Path('data_n4.json').read_text(encoding='utf-8'))['vocab']
          extra=json.loads(Path('vocab_n4_26_31.json').read_text(encoding='utf-8'))
          sources=[]
          for x in n4: sources.append({'source':'kanji_n4','lesson':x.get('lesson'),'word':x.get('word',''),'reading':x.get('reading',''),'meaning':x.get('meaning','')})
          for x in extra: sources.append({'source':'new_vocab_n4','lesson':x.get('lesson'),'word':x.get('ja',''),'reading':x.get('furigana',''),'meaning':x.get('vi','')})
          exact={(x['word'],x['reading']):x for x in sources}
          byword={}; bysig={}
          for x in sources:
            byword.setdefault(x['word'],[]).append(x)
            if sig(x['word']): bysig.setdefault(sig(x['word']),[]).append(x)
          rows=[]
          for line in Path('analysis/crawl_candidates_163.tsv').read_text(encoding='utf-8').splitlines():
            qid,surface,word,reading=line.split('\t')
            status='new'; matches=[]
            if (word,reading) in exact:
              status='exact_existing'; matches=[exact[(word,reading)]]
            elif word in byword:
              status='word_existing'; matches=byword[word]
            else:
              s=sig(word); fuzzy=[]
              for x in bysig.get(s,[]):
                p=pref(reading,x['reading'])
                if p>=3 or (len(s)==1 and p>=2): fuzzy.append((p,x))
              if fuzzy:
                fuzzy.sort(key=lambda z:(-z[0],z[1]['word'],z[1]['reading']))
                status='likely_variant'; matches=[x for _,x in fuzzy[:6]]
            rows.append({'question_id':qid,'surface':surface,'word':word,'reading':reading,'status':status,'matches':matches})
          summary={}
          for r in rows: summary[r['status']]=summary.get(r['status'],0)+1
          out={'summary':summary,'rows':rows}
          Path('analysis/candidate_match_report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(summary)
          PY
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/candidate_match_report.json
          git commit -m 'chore: analyze N4 crawl candidates against current vocab'
          git push
