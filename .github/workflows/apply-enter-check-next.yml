name: Apply Enter check and next shortcut

on:
  push:
    branches:
      - fix-enter-check-next
    paths:
      - .github/workflows/apply-enter-check-next.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-enter-check-next
          fetch-depth: 0

      - name: Apply Enter behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old = '''  if (e.altKey || e.ctrlKey || e.metaKey) return;
            if (answered) {
              e.preventDefault();
              nextQuestion();
            }
          });'''
          new = '''  if (e.altKey || e.ctrlKey || e.metaKey) return;
            if (answerMode === "write" && !answered) {
              e.preventDefault();
              checkWritten();
              return;
            }
            if (answered) {
              e.preventDefault();
              nextQuestion();
            }
          });'''
          if old not in html:
              raise SystemExit('Keyboard handler target not found')
          html = html.replace(old, new, 1)

          old_hint = '<kbd>Shift</kbd> + <kbd>Enter</kbd> để xem đáp án · <kbd>Enter</kbd> để sang câu tiếp.'
          new_hint = '<kbd>Shift</kbd> + <kbd>Enter</kbd> để xem đáp án · <kbd>Enter</kbd> để kiểm tra / sang câu tiếp.'
          count = html.count(old_hint)
          if count != 4:
              raise SystemExit(f'Expected 4 shortcut hints, found {count}')
          html = html.replace(old_hint, new_hint)

          path.write_text(html, encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          assert 'answerMode === "write" && !answered' in updated
          assert 'checkWritten();' in updated
          assert 'if (answered)' in updated and 'nextQuestion();' in updated
          assert updated.count('Enter</kbd> để kiểm tra / sang câu tiếp') == 4
          print('Validated: Shift+Enter shows answer; Enter checks unanswered written response or advances after answer')
          PY

      - name: Commit final file only
        shell: bash
        run: |
          rm -f .github/workflows/apply-enter-check-next.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git add -u -- .github/workflows/apply-enter-check-next.yml
          git diff --cached --check
          git commit -m "Restore Enter to check written answers"
          git push origin HEAD:fix-enter-check-next
