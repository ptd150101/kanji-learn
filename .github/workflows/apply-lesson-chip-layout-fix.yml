name: Apply lesson chip layout fix

on:
  push:
    branches:
      - fix-lesson-chip-layout

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Apply and verify layout fix
        working-directory: repo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.chip{min-width:0}\n'
          new = '.chip{\n  min-width:0;\n  display:flex;\n  align-items:stretch;\n}\n'
          if old not in s:
              raise SystemExit('Expected .chip rule not found')
          s = s.replace(old, new, 1)
          old = '''.chip span{\n  display:flex;\n  align-items:center;\n  width:100%;\n  min-height:48px;'''
          new = '''.chip span{\n  display:flex;\n  align-items:center;\n  width:100%;\n  min-height:62px;\n  flex:1 1 auto;'''
          if old not in s:
              raise SystemExit('Expected .chip span rule not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', s)
          Path('/tmp/inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/inline.js
          grep -q 'min-height:62px;' index.html
          grep -q 'align-items:stretch;' index.html
      - name: Commit and push final change
        working-directory: repo
        run: |
          rm .github/workflows/apply-lesson-chip-layout-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git add -u -- .github/workflows/apply-lesson-chip-layout-fix.yml
          git commit -m "Stabilize lesson chip heights"
          git push origin HEAD:"$GITHUB_REF_NAME"
