name: Apply mobile-first responsive

on:
  push:
    branches:
      - mobile-first-responsive

permissions:
  contents: write

jobs:
  apply-responsive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: mobile-first-responsive
          fetch-depth: 0

      - name: Verify current baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "4e7051ebc503835766c846408011ce88bbcd982c"

      - name: Fetch and apply verified responsive patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          url = 'https://api.github.com/repos/ptd150101/kanji-learn/git/blobs/42918f354de47e4e5c39d769efe21e9ccab65693'
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req) as r:
              payload = json.load(r)
          raw = base64.b64decode(payload['content'])
          open('/tmp/mobile-first-responsive.patch.gz', 'wb').write(raw)
          PY
          gunzip -c /tmp/mobile-first-responsive.patch.gz | patch --batch -p5
          test "$(git hash-object index.html)" = "ac6a235e278a3090f2a8d0ae4cc3d9a5d345acdd"
          grep -q 'viewport-fit=cover' index.html
          grep -q '@media (min-width:600px)' index.html
          grep -q '@media (min-width:960px)' index.html
          grep -q 'visualViewport' index.html

      - name: Commit responsive implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/apply-mobile-first-responsive.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .github/workflows/apply-mobile-first-responsive.yml
          git diff --cached --name-only
          git commit -m 'Add mobile-first responsive layout'
          git push origin HEAD:mobile-first-responsive
