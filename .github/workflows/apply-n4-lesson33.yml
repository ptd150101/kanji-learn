name: Apply N4 lesson 33 vocabulary

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-n4-vocab-lesson-33
          fetch-depth: 0

      - name: Apply lesson 33 data
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          payload_path = Path('.sync/lesson33.json')
          source_path = Path('vocab_n4_26_31.json')
          index_path = Path('index.html')
          readme_path = Path('README.md')

          lesson33 = json.loads(payload_path.read_text(encoding='utf-8'))
          assert len(lesson33) == 37, f'Expected 37 lesson-33 entries, got {len(lesson33)}'
          assert all(item.get('lesson') == 33 for item in lesson33)
          assert all(item.get('vi') and item.get('ja') and item.get('furigana') for item in lesson33)

          source = json.loads(source_path.read_text(encoding='utf-8'))
          source = [item for item in source if item.get('lesson') != 33]
          source.extend(lesson33)
          source_path.write_text(json.dumps(source, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          html = index_path.read_text(encoding='utf-8')
          match = re.search(r'const NEW_VOCAB = (\[.*?\]);\n', html, flags=re.S)
          if not match:
              raise SystemExit('NEW_VOCAB array not found in index.html')
          embedded = json.loads(match.group(1))
          embedded = [item for item in embedded if item.get('lesson') != 33]
          embedded.extend([
              {
                  'id': f'v33-{i}',
                  'lesson': 33,
                  'word': item['ja'],
                  'reading': item['furigana'],
                  'meaning': item['vi'],
                  'level': 'N4',
              }
              for i, item in enumerate(lesson33, start=1)
          ])
          replacement = 'const NEW_VOCAB = ' + json.dumps(embedded, ensure_ascii=False, separators=(',', ':')) + ';\n'
          html = html[:match.start()] + replacement + html[match.end():]
          html = html.replace(
              'N4 từ mới: ${NEW_VOCAB.length} từ vựng • Bài 26–31 • 4 chế độ kiểm tra',
              'N4 từ mới: ${NEW_VOCAB.length} từ vựng • Bài 26–31, 33 • 4 chế độ kiểm tra'
          )
          html = html.replace(
              'Bộ <b>từ mới N4 bài 26–31</b>',
              'Bộ <b>từ mới N4 bài 26–31, 33</b>'
          )
          index_path.write_text(html, encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '## Kiểm tra từ mới N4 — bài 26–31',
              '## Kiểm tra từ mới N4 — bài 26–31 và 33'
          )
          readme = readme.replace(
              '- Tích hợp thêm **184 từ mới** từ app tham khảo, chia theo bài: 26 (22 từ), 27 (23), 28 (39), 29 (47), 30 (34), 31 (19).',
              '- Tích hợp **221 từ mới**, chia theo bài: 26 (22 từ), 27 (23), 28 (39), 29 (47), 30 (34), 31 (19), 33 (37).'
          )
          readme = readme.replace(
              '- Có thể chọn riêng từng bài 26–31 hoặc chọn nhiều bài; vẫn dùng số câu, thứ tự, TTS, điểm số, ôn câu sai và giao diện responsive hiện tại.',
              '- Có thể chọn riêng từng bài 26–31 và 33 hoặc chọn nhiều bài; vẫn dùng số câu, thứ tự, TTS, điểm số, ôn câu sai và giao diện responsive hiện tại.'
          )
          readme_path.write_text(readme, encoding='utf-8')

          updated_source = json.loads(source_path.read_text(encoding='utf-8'))
          assert len(updated_source) == 221, len(updated_source)
          assert len([x for x in updated_source if x['lesson'] == 33]) == 37
          assert [x['lesson'] for x in updated_source[-37:]] == [33] * 37

          updated_html = index_path.read_text(encoding='utf-8')
          updated_match = re.search(r'const NEW_VOCAB = (\[.*?\]);\n', updated_html, flags=re.S)
          updated_embedded = json.loads(updated_match.group(1))
          assert len(updated_embedded) == 221, len(updated_embedded)
          assert len([x for x in updated_embedded if x['lesson'] == 33]) == 37
          assert len({x['id'] for x in updated_embedded}) == len(updated_embedded)
          assert 'Bài 26–31, 33' in updated_html
          assert 'từ mới N4 bài 26–31, 33' in updated_html
          print('Validated: 221 total vocabulary entries; lesson 33 = 37 entries')
          PY

      - name: Commit final feature files only
        shell: bash
        run: |
          rm -f .sync/lesson33.json .github/workflows/apply-n4-lesson33.yml
          rmdir .sync 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html README.md vocab_n4_26_31.json
          git add -u -- .sync/lesson33.json .github/workflows/apply-n4-lesson33.yml
          git diff --cached --check
          git commit -m "Add N4 vocabulary for lesson 33"
          git push origin HEAD:add-n4-vocab-lesson-33
