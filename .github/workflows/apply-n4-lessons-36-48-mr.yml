          assert len(new_rows) == 383, f'Expected 383 new rows, got {len(new_rows)}'
          new_lessons = set(range(36, 49)) | {'MR1', 'MR2'}
          assert not any(row.get('lesson') in new_lessons for row in rows), 'New lessons already exist'
          rows.extend(new_rows)
          source_path.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sync_path = Path('scripts/sync-new-vocab.mjs')
          sync = sync_path.read_text(encoding='utf-8')
          old = '''    const lesson = Number(row.lesson);\n    if (!Number.isInteger(lesson)) {\n      throw new TypeError(`Mục ${index + 1} có lesson không hợp lệ`);\n    }'''
          new = '''    const rawLesson = row.lesson;\n    const lesson = typeof rawLesson === "number" ? rawLesson : (typeof rawLesson === "string" ? rawLesson.trim() : rawLesson);\n    const validLesson = Number.isInteger(lesson) || (typeof lesson === "string" && /^[A-Z]+\\d+$/u.test(lesson));\n    if (!validLesson) {\n      throw new TypeError(`Mục ${index + 1} có lesson không hợp lệ`);\n    }'''
          if old not in sync: raise SystemExit('sync lesson parser target not found')
          sync_path.write_text(sync.replace(old, new, 1), encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = html.replace('Bài 26–35 • 4 chế độ kiểm tra', 'Bài 26–48 + MR1–MR2 • 4 chế độ kiểm tra')
          html = html.replace('từ mới N4 bài 26–35', 'từ mới N4 bài 26–48 + MR1–MR2')
          old_render = '''    const lessons = [...new Set(NEW_VOCAB.map(v => v.lesson))].sort((a,b) => a-b);\n    lessons.forEach(lesson => {\n      const count = NEW_VOCAB.filter(v => v.lesson === lesson).length;\n      const label = document.createElement("label");\n      label.className = "chip";\n      label.title = `Bài ${lesson} · ${count} từ mới`;\n      label.innerHTML = `\n        <input type="checkbox" value="${lesson}" checked>\n        <span>\n          <span class="lesson-chip-name">Bài ${lesson}</span>'''
          new_render = '''    const lessons = [...new Set(NEW_VOCAB.map(v => v.lesson))].sort(compareLessonValues);\n    lessons.forEach(lesson => {\n      const count = NEW_VOCAB.filter(v => v.lesson === lesson).length;\n      const displayLesson = lessonDisplayName(lesson);\n      const label = document.createElement("label");\n      label.className = "chip";\n      label.title = `${displayLesson} · ${count} từ mới`;\n      label.innerHTML = `\n        <input type="checkbox" value="${lesson}" checked>\n        <span>\n          <span class="lesson-chip-name">${displayLesson}</span>'''
          if old_render not in html: raise SystemExit('renderLessonPicker target not found')
          html = html.replace(old_render, new_render, 1)
          old_selected = '''function selectedLessons() {\n  return [...document.querySelectorAll('.lessons input:checked')].map(x => Number(x.value));\n}'''
          new_selected = '''function parseLessonValue(value) {\n  const raw = String(value).trim();\n  return /^\\d+$/u.test(raw) ? Number(raw) : raw;\n}\n\nfunction compareLessonValues(a, b) {\n  const aNum = typeof a === "number";\n  const bNum = typeof b === "number";\n  if (aNum && bNum) return a - b;\n  if (aNum) return -1;\n  if (bNum) return 1;\n  return String(a).localeCompare(String(b), "en", {numeric:true});\n}\n\nfunction lessonDisplayName(lesson) {\n  return typeof lesson === "number" ? `Bài ${lesson}` : String(lesson);\n}\n\nfunction selectedLessons() {\n  return [...document.querySelectorAll('.lessons input:checked')].map(x => parseLessonValue(x.value));\n}'''
          if old_selected not in html: raise SystemExit('selectedLessons target not found')
          html = html.replace(old_selected, new_selected, 1)
          old_restore = '''    const selected = new Set(settings.lessons.map(Number));\n    document.querySelectorAll('.lessons input[type="checkbox"]').forEach(box => {\n      box.checked = selected.has(Number(box.value));\n    });'''
          new_restore = '''    const selected = new Set(settings.lessons.map(value => String(value)));\n    document.querySelectorAll('.lessons input[type="checkbox"]').forEach(box => {\n      box.checked = selected.has(String(box.value));\n    });'''
          if old_restore not in html: raise SystemExit('resume lesson selection target not found')
