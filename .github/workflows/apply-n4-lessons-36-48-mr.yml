          html = html.replace('.replace(/[~〜～]/g, "");\n}\n\nfunction matchesReading', '.replace(/\\[[^\\]]*\\]/g, "")\n    .replace(/[~〜～]/g, "");\n}\n\nfunction matchesReading', 1)
