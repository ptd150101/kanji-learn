name: Apply resume session patch

on:
  push:
    branches: [resume-session]
    paths:
      - 'resume-session.patch'
      - '.github/workflows/apply-resume-session.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resume-session
          fetch-depth: 0
      - name: Apply patch
        run: git apply resume-session.patch
      - name: Commit generated index
        run: |
          rm resume-session.patch
          rm .github/workflows/apply-resume-session.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html resume-session.patch .github/workflows/apply-resume-session.yml
          git commit -m 'Add resumable quiz sessions'
          git push origin HEAD:resume-session
