name: Apply single-line lesson chips

on:
  push:
    branches:
      - single-line-lesson-chips
    paths:
      - .github/workflows/apply-single-line-lesson-chips.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: single-line-lesson-chips
      - name: Apply UI fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old_css = '''.chip{\n  min-width:0;\n  display:flex;\n  align-items:stretch;\n}\n.chip input{\n  position:absolute;\n  width:1px;\n  height:1px;\n  opacity:0;\n  pointer-events:none;\n}\n.chip span{\n  display:flex;\n  align-items:center;\n  width:100%;\n  min-height:62px;\n  flex:1 1 auto;\n  border:1px solid var(--border);\n  padding:9px 12px;\n  border-radius:999px;\n  color:var(--muted);\n  line-height:1.3;\n  overflow-wrap:anywhere;\n  transition:.15s;\n}\n.chip input:checked+span{background:rgba(47,158,158,.18);border-color:var(--accent);color:var(--text)}\n.chip input:focus-visible+span{outline:2px solid var(--accent2);outline-offset:2px}\n'''
          new_css = '''.chip{\n  min-width:0;\n  display:flex;\n  align-items:stretch;\n}\n.chip input{\n  position:absolute;\n  width:1px;\n  height:1px;\n  opacity:0;\n  pointer-events:none;\n}\n.chip>span{\n  display:flex;\n  align-items:center;\n  gap:8px;\n  width:100%;\n  height:48px;\n  min-height:48px;\n  flex:1 1 auto;\n  border:1px solid var(--border);\n  padding:8px 9px 8px 12px;\n  border-radius:999px;\n  color:var(--muted);\n  line-height:1.2;\n  overflow:hidden;\n  white-space:nowrap;\n  transition:.15s;\n}\n.lesson-chip-name{\n  min-width:0;\n  flex:1 1 auto;\n  overflow:hidden;\n  text-overflow:ellipsis;\n  white-space:nowrap;\n}\n.lesson-chip-count{\n  flex:0 0 auto;\n  padding:4px 7px;\n  border:1px solid var(--border);\n  border-radius:999px;\n  color:var(--muted);\n  font-size:12px;\n  line-height:1;\n}\n.chip input:checked+span{background:rgba(47,158,158,.18);border-color:var(--accent);color:var(--text)}\n.chip input:checked+span .lesson-chip-count{border-color:rgba(88,209,201,.45);color:var(--accent2)}\n.chip input:focus-visible+span{outline:2px solid var(--accent2);outline-offset:2px}\n'''
          if old_css not in s:
              raise SystemExit('Expected lesson chip CSS block not found')
          s = s.replace(old_css, new_css, 1)

          old_vocab = '''      const label = document.createElement("label");\n      label.className = "chip";\n      label.innerHTML = `\n        <input type="checkbox" value="${lesson}" checked>\n        <span>Bài ${lesson} · ${count} từ mới</span>\n      `;\n      root.appendChild(label);\n'''
          new_vocab = '''      const label = document.createElement("label");\n      label.className = "chip";\n      label.title = `Bài ${lesson} · ${count} từ mới`;\n      label.innerHTML = `\n        <input type="checkbox" value="${lesson}" checked>\n        <span>\n          <span class="lesson-chip-name">Bài ${lesson}</span>\n          <span class="lesson-chip-count">${count} từ</span>\n        </span>\n      `;\n      root.appendChild(label);\n'''
          if old_vocab not in s:
              raise SystemExit('Expected vocab lesson markup not found')
          s = s.replace(old_vocab, new_vocab, 1)

          old_kanji = '''      const label = document.createElement("label");\n      label.className = "chip";\n      label.innerHTML = `\n        <input type="checkbox" value="${lesson}" checked>\n        <span>Bài ${lesson} · ${lessons[lesson]} · ${count} từ</span>\n      `;\n      root.appendChild(label);\n'''
          new_kanji = '''      const label = document.createElement("label");\n      label.className = "chip";\n      label.title = `Bài ${lesson} · ${lessons[lesson]} · ${count} từ`;\n      label.innerHTML = `\n        <input type="checkbox" value="${lesson}" checked>\n        <span>\n          <span class="lesson-chip-name">Bài ${lesson} · ${lessons[lesson]}</span>\n          <span class="lesson-chip-count">${count} từ</span>\n        </span>\n      `;\n      root.appendChild(label);\n'''
          if old_kanji not in s:
              raise SystemExit('Expected Kanji lesson markup not found')
          s = s.replace(old_kanji, new_kanji, 1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'class="lesson-chip-name"' index.html
          grep -q 'class="lesson-chip-count"' index.html
          grep -q 'text-overflow:ellipsis' index.html
          grep -q 'height:48px' index.html
      - name: Commit and push
        run: |
          rm .github/workflows/apply-single-line-lesson-chips.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html .github/workflows/apply-single-line-lesson-chips.yml
          git commit -m "Make lesson chips single-line and stable"
          git push origin HEAD:single-line-lesson-chips
