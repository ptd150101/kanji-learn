name: Apply Kanji Learn v6

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  apply-v6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and verify v6 archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/v6.part00 .upload/v6.part01 .upload/v6.part02 .upload/v6.part03 .upload/v6.part04 .upload/v6.part05 .upload/v6.part06a .upload/v6.part06b .upload/v6.part06c .upload/v6.part07 | base64 -d > /tmp/kanji-v6.zip
          echo 'e31d3256e139508be758f35ccd87b2ab4603adbea077923dd7806d596d70d698  /tmp/kanji-v6.zip' | sha256sum -c -
          unzip -t /tmp/kanji-v6.zip >/dev/null
          rm -rf /tmp/kanji-v6
          mkdir -p /tmp/kanji-v6
          unzip -q /tmp/kanji-v6.zip -d /tmp/kanji-v6
          SRC="$(find /tmp/kanji-v6 -type f -name index.html -printf '%h\n' | head -n1)"
          test -n "$SRC"
          for f in index.html README.md data.json han_viet.json data_n5.json data_n4.json; do
            test -f "$SRC/$f"
            cp "$SRC/$f" "$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('data.json','han_viet.json','data_n5.json','data_n4.json'):
              with Path(name).open('r', encoding='utf-8') as f:
                  json.load(f)
          PY
          test "$(git hash-object index.html)" = '4e7051ebc503835766c846408011ce88bbcd982c'
          test "$(git hash-object README.md)" = 'f480a273b945bb6c3ad45ade8f9a9654ce62cd3d'
          test "$(git hash-object data.json)" = '150c31b77412cc54a3c03fe1bd254c8faec3f608'
          test "$(git hash-object han_viet.json)" = 'a115cc34b5094d5877cadc60d74aca11a42e2b1e'
          test "$(git hash-object data_n5.json)" = '1dceb050d8139825f031de34504eb8b7b9fcdfd9'
          test "$(git hash-object data_n4.json)" = 'b1b19ae3f62a8f6a7671371ffe460e37e9855f42'

      - name: Commit v6 site files and clean staging payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload
          rm -- .github/workflows/apply-v6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html README.md data.json han_viet.json data_n5.json data_n4.json .upload .github/workflows/apply-v6.yml
          printf 'Files to publish:\n'
          git diff --cached --name-only
          git commit -m 'Update Kanji Learn with N5 and N4 quiz v6'
          git push origin HEAD:main
