name: Check crawl candidates
on:
  push:
    branches: [feat/add-crawled-n4-kanji-lessons]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-crawled-n4-kanji-lessons
      - name: Check canonical candidate duplicates and Han-Viet
        run: |
          python - <<'PY'
          import json, sqlite3, pathlib, re
          C = [
          ('注ぐ','そそぐ'),('声楽','せいがく'),('草原','そうげん'),('冷水','れいすい'),('起床','きしょう'),('森','もり'),('困難','こんなん'),('取得','しゅとく'),('一人旅','ひとりたび'),('方','かた'),('低速','ていそく'),('血','ち'),('未定','みてい'),('通学','つうがく'),('映す','うつす'),('菜の花','なのはな'),('親指','おやゆび'),('多々','たた'),('この度','このたび'),('暗黒','あんこく'),('静止画','せいしが'),('音楽会','おんがくかい'),('所持','しょじ'),('市','し'),('春秋','しゅんじゅう'),('習字','しゅうじ'),('体','からだ'),('遊園地','ゆうえんち'),('耳の穴','みみのあな'),('両方','りょうほう'),('好む','このむ'),('血液','けつえき'),('空席','くうせき'),('林','はやし'),('頭部','とうぶ'),('宿舎','しゅくしゃ'),('雑木林','ぞうきばやし'),('何年','なんねん'),('上品','じょうひん'),('演説','えんぜつ'),('冷たい','つめたい'),('止む','やむ'),('飲料','いんりょう'),('離島','りとう'),('短命','たんめい'),('都内','とない'),('配達','はいたつ'),('職員','しょくいん'),('音','おと'),('化学','かがく'),('借りる','かりる'),('晴天','せいてん'),('太平洋','たいへいよう'),('集合','しゅうごう'),('積雪','せきせつ'),('次の','つぎの'),('肉屋','にくや'),('お昼ご飯','おひるごはん'),('公','おおやけ'),('子牛','こうし'),('有料','ゆうりょう'),('小鳥','ことり'),('重力','じゅうりょく'),('銀色','ぎんいろ'),('作り方','つくりかた'),('運転','うんてん'),('ひとり親','ひとりおや'),('決定','けってい'),('羽毛','うもう'),('両替','りょうがえ'),('冷える','ひえる')]
          db=sqlite3.connect('data/kanji_vocab.sqlite'); db.row_factory=sqlite3.Row
          hv=json.loads(pathlib.Path('han_viet.json').read_text(encoding='utf-8'))
          krx=re.compile(r'[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]')
          out=[]
          for w,r in C:
            same=[dict(x) for x in db.execute('SELECT id,word,reading,meaning_vi,level FROM vocab WHERE normalized_word=?',(w,))]
            chars=[]
            for ch in dict.fromkeys(krx.findall(w)):
              chars.append({'char':ch,'han_viet':hv.get(ch)})
            out.append({'word':w,'reading':r,'same_word':same,'han_viet_chars':chars})
          pathlib.Path('.tmp/crawl-candidate-check.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('candidates',len(C),'same_word',sum(bool(x['same_word']) for x in out),'missing_hv_chars',sum(sum(1 for c in x['han_viet_chars'] if not c['han_viet']) for x in out))
          PY
      - name: Commit check and remove workflow
        run: |
          rm -f .github/workflows/check-crawl-candidates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/crawl-candidate-check.json .github/workflows/check-crawl-candidates.yml
          git commit -m "Check canonical crawl candidates"
          git push origin HEAD:feat/add-crawled-n4-kanji-lessons
