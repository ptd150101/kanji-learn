name: Diagnose Han-Viet and TTS
on:
  push:
    branches: [fix/hanviet-tts]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build diagnostics report
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vocab = JSON.parse(fs.readFileSync('vocab_n4_26_31.json','utf8'));
          const hv = JSON.parse(fs.readFileSync('han_viet.json','utf8'));
          const hanRe = /\p{Script=Han}/gu;
          const missing = new Map();
          for (const row of vocab) {
            const chars = row.ja.match(hanRe) || [];
            for (const ch of chars) {
              if (!hv[ch]) {
                if (!missing.has(ch)) missing.set(ch, []);
                const ex = `${row.lesson}: ${row.ja} (${row.furigana})`;
                if (!missing.get(ch).includes(ex) && missing.get(ch).length < 4) missing.get(ch).push(ex);
              }
            }
          }
          const smallKanaRe = /[ゃゅょぁぃぅぇぉャュョァィゥェォっッ]/u;
          const oddTtsRe = /[\[\]~〜～0-9０-９A-Za-z]/u;
          const small = vocab.filter(r => smallKanaRe.test(r.furigana));
          const odd = vocab.filter(r => oddTtsRe.test(r.furigana));
          const lines = [];
          lines.push(`TOTAL_VOCAB=${vocab.length}`);
          lines.push(`HANVIET_KEYS=${Object.keys(hv).length}`);
          lines.push(`MISSING_HAN_COUNT=${missing.size}`);
          lines.push('MISSING_HAN:');
          for (const [ch, ex] of [...missing.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ja'))) {
            lines.push(`${ch}\t${ex.join(' | ')}`);
          }
          lines.push('');
          lines.push(`SMALL_KANA_COUNT=${small.length}`);
          for (const r of small) lines.push(`SMALL\t${r.lesson}\t${r.ja}\t${r.furigana}`);
          lines.push('');
          lines.push(`ODD_TTS_COUNT=${odd.length}`);
          for (const r of odd) lines.push(`ODD\t${r.lesson}\t${r.ja}\t${r.furigana}`);
          fs.writeFileSync('diagnostics-han-tts.txt', lines.join('\n')+'\n');
          NODE
      - name: Commit report and remove temporary workflow
        run: |
          rm .github/workflows/diagnose-hanviet-tts.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics-han-tts.txt .github/workflows/diagnose-hanviet-tts.yml
          git commit -m "Diagnose Han-Viet coverage and TTS inputs"
          git push
