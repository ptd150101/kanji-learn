name: Export unmatched crawl
on:
  push:
    branches: [feat/add-crawled-n4-kanji-lessons]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-crawled-n4-kanji-lessons
      - name: Export compact unmatched TSV
        run: |
          python - <<'PY'
          import json, pathlib
          rows=json.loads(pathlib.Path('.tmp/crawl-db-summary.json').read_text(encoding='utf-8'))['unmatched_rows']
          lines=['qid\tunderline\tanswers\tsentence\tsame_signature\texact_word']
          for r in rows:
            sig='; '.join(f"{x['word']}={x['reading']}({x.get('meaning') or ''},{x.get('level') or ''})" for x in r.get('same_kanji_signature',[]))
            exact='; '.join(f"{x['word']}={x['reading']}({x.get('meaning') or ''},{x.get('level') or ''})" for x in r.get('exact',[]))
            fields=[r['id'],r['u'],'/'.join(r['a']),r['s'],sig,exact]
            lines.append('\t'.join(str(x).replace('\t',' ').replace('\n',' ') for x in fields))
          pathlib.Path('.tmp/crawl-unmatched.tsv').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('unmatched',len(rows))
          PY
      - name: Commit TSV and remove workflow
        run: |
          rm -f .github/workflows/export-unmatched-crawl.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/crawl-unmatched.tsv .github/workflows/export-unmatched-crawl.yml
          git commit -m "Export unmatched crawled N4 questions"
          git push origin HEAD:feat/add-crawled-n4-kanji-lessons
