name: Fetch KanjiDictVN Han-Viet readings
on:
  push:
    branches: [fix/hanviet-tts]
permissions:
  contents: write
jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download KanjiDictVN release
        run: |
          curl -L --fail --retry 3 -o /tmp/kdict.zip https://github.com/trungnt2910/KanjiDictVN/releases/latest/download/KANJIDIC_vietnamese.zip
          mkdir -p /tmp/kdict
          unzip -q /tmp/kdict.zip -d /tmp/kdict
          find /tmp/kdict -maxdepth 2 -type f | sort | head -100
      - name: Build Han-Viet report
        run: |
          node <<'NODE'
          const fs=require('fs'), path=require('path');
          const vocab=JSON.parse(fs.readFileSync('vocab_n4_26_31.json','utf8'));
          const hv=JSON.parse(fs.readFileSync('han_viet.json','utf8'));
          const files=fs.readdirSync('/tmp/kdict').filter(f=>/^kanji_bank_.*\.json$/i.test(f));
          const dict={};
          for(const f of files){
            const rows=JSON.parse(fs.readFileSync(path.join('/tmp/kdict',f),'utf8'));
            for(const row of rows){
              if(!Array.isArray(row)||typeof row[0]!=='string') continue;
              const readings=[];
              if(typeof row[1]==='string') readings.push(...row[1].split(/[,;]\s*/));
              else if(Array.isArray(row[1])) readings.push(...row[1]);
              const cleaned=[...new Set(readings.map(x=>String(x).trim()).filter(Boolean))];
              if(cleaned.length) dict[row[0]]=cleaned;
            }
          }
          const han=new Set(); for(const r of vocab) for(const ch of (r.ja.match(/\p{Script=Han}/gu)||[])) han.add(ch);
          const missing=[...han].filter(ch=>!hv[ch]).sort((a,b)=>a.localeCompare(b,'ja'));
          const mapped={}, no=[];
          for(const ch of missing){ if(dict[ch]) mapped[ch]=dict[ch]; else no.push(ch); }
          let overlap=0, match=0, diff=[];
          const norm=s=>String(s).normalize('NFC').toLocaleUpperCase('vi-VN').trim();
          for(const [ch,val] of Object.entries(hv)){ if(!dict[ch]) continue; overlap++; if(dict[ch].map(norm).includes(norm(val))) match++; else if(diff.length<100) diff.push([ch,val,dict[ch]]); }
          const out={bankFiles:files.length,dictCount:Object.keys(dict).length,missingCount:missing.length,mappedCount:Object.keys(mapped).length,no,overlap,existingMatches:match,diff,mapped};
          fs.writeFileSync('kanjidictvn-hv-report.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({...out,mapped:undefined,diff:diff.slice(0,20)},null,2));
          NODE
      - name: Commit report and remove temporary workflow
        run: |
          rm .github/workflows/fetch-kanjidictvn-hv.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kanjidictvn-hv-report.json .github/workflows/fetch-kanjidictvn-hv.yml
          git commit -m "Compare Han-Viet map with KanjiDictVN"
          git push
