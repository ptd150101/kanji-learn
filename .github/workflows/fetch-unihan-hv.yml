name: Fetch Unihan Vietnamese readings
on:
  push:
    branches: [fix/hanviet-tts]
permissions:
  contents: write
jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Unihan readings mirror
        run: curl -L --fail --retry 3 -o /tmp/Unihan_Readings.txt https://raw.githubusercontent.com/anyascii/anyascii/master/input/Unihan_Readings.txt
      - name: Build Vietnamese reading report
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vocab = JSON.parse(fs.readFileSync('vocab_n4_26_31.json','utf8'));
          const hv = JSON.parse(fs.readFileSync('han_viet.json','utf8'));
          const txt = fs.readFileSync('/tmp/Unihan_Readings.txt','utf8');
          const uni = {};
          for (const line of txt.split(/\r?\n/)) {
            const m = line.match(/^U\+([0-9A-F]+)\s+kVietnamese\s+(.+)$/u);
            if (!m) continue;
            uni[String.fromCodePoint(parseInt(m[1],16))] = m[2].trim();
          }
          const han = new Set();
          for (const row of vocab) for (const ch of (row.ja.match(/\p{Script=Han}/gu)||[])) han.add(ch);
          const missing = [...han].filter(ch => !hv[ch]).sort((a,b)=>a.localeCompare(b,'ja'));
          const noUnihan = missing.filter(ch => !uni[ch]);
          const mapped = Object.fromEntries(missing.filter(ch => uni[ch]).map(ch => [ch, uni[ch]]));
          let overlap=0, exact=0, different=[];
          for (const [ch,val] of Object.entries(hv)) {
            if (!uni[ch]) continue;
            overlap++;
            const norm=s=>s.normalize('NFC').toLocaleUpperCase('vi-VN').replace(/\s+/g,' ').trim();
            const vals=uni[ch].split(/\s+/).map(norm);
            if (vals.includes(norm(val))) exact++;
            else if (different.length<80) different.push([ch,val,uni[ch]]);
          }
          const out={source:'Unicode Unihan kVietnamese via anyascii mirror',missingCount:missing.length,mappedCount:Object.keys(mapped).length,noUnihan,overlap,existingMatchesAnyUnihanValue:exact,different,mapped};
          fs.writeFileSync('unihan-hv-report.json',JSON.stringify(out,null,2)+'\n');
          console.log(out);
          NODE
      - name: Commit report and remove temporary workflow
        run: |
          rm .github/workflows/fetch-unihan-hv.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add unihan-hv-report.json .github/workflows/fetch-unihan-hv.yml
          git commit -m "Compare Han-Viet map with Unihan Vietnamese readings"
          git push
