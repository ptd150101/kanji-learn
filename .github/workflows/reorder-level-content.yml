name: Apply level-first quiz setup

on:
  push:
    branches:
      - reorder-level-content
    paths:
      - .github/workflows/reorder-level-content.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reorder-level-content
          fetch-depth: 0

      - name: Reorder setup and add N5-N1 selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''    <div>\n      <div class="label">0. Nội dung kiểm tra</div>\n      <div class="mode-grid content-mode-grid">\n        <button class="mode-btn content-mode-btn active" data-content-mode="kanji" type="button">\n          <strong>Kanji</strong>\n          <small>Giữ nguyên bài kiểm tra Kanji N5 / N4 hiện tại.</small>\n        </button>\n        <button class="mode-btn content-mode-btn" data-content-mode="vocab" type="button">\n          <strong>Từ mới N4 · Bài 26–31</strong>\n          <small>Kiểm tra 184 từ mới theo từng bài, tích hợp từ bộ dữ liệu bạn cung cấp.</small>\n        </button>\n      </div>\n    </div>\n\n    <div id="levelSection" class="setup-section">\n      <div class="label">1. Chọn cấp độ</div>\n      <div class="level-tabs">\n        <button class="level-btn active" data-level="N5" type="button">N5 · 26 bài</button>\n        <button class="level-btn" data-level="N4" type="button">N4 · 24 bài</button>\n      </div>\n    </div>\n'''
          new = '''    <div id="levelSection" class="setup-section">\n      <div class="label">0. Chọn cấp độ</div>\n      <div class="level-tabs">\n        <button class="level-btn active" data-level="N5" type="button">N5</button>\n        <button class="level-btn" data-level="N4" type="button">N4</button>\n        <button class="level-btn" data-level="N3" type="button" disabled title="Chưa có dữ liệu N3">N3</button>\n        <button class="level-btn" data-level="N2" type="button" disabled title="Chưa có dữ liệu N2">N2</button>\n        <button class="level-btn" data-level="N1" type="button" disabled title="Chưa có dữ liệu N1">N1</button>\n      </div>\n    </div>\n\n    <div>\n      <div class="label">1. Nội dung kiểm tra</div>\n      <div class="mode-grid content-mode-grid">\n        <button class="mode-btn content-mode-btn active" data-content-mode="kanji" type="button">\n          <strong>Kanji</strong>\n        </button>\n        <button class="mode-btn content-mode-btn" data-content-mode="vocab" type="button">\n          <strong>Từ mới</strong>\n        </button>\n      </div>\n    </div>\n'''
          if old not in s:
              raise SystemExit('setup block not found')
          s = s.replace(old, new)

          s = s.replace('''.level-tabs{\n  display:grid;\n  grid-template-columns:repeat(2,minmax(0,1fr));''', '''.level-tabs{\n  display:grid;\n  grid-template-columns:repeat(3,minmax(0,1fr));''')
          s = s.replace('''.level-btn.active{border-color:var(--accent);background:rgba(47,158,158,.16);color:var(--text);box-shadow:0 0 0 1px var(--accent) inset}\n.lessons{''', '''.level-btn.active{border-color:var(--accent);background:rgba(47,158,158,.16);color:var(--text);box-shadow:0 0 0 1px var(--accent) inset}\n.level-btn:disabled{opacity:.42;cursor:not-allowed}\n.content-mode-grid .mode-btn{min-height:58px;text-align:center}\n.content-mode-grid .mode-btn:disabled{opacity:.42;cursor:not-allowed}\n.lessons{''')

          old_js = '''function setContentMode(mode) {\n  contentMode = mode;\n  document.querySelectorAll(".content-mode-btn").forEach(btn => {\n    btn.classList.toggle("active", btn.dataset.contentMode === mode);\n  });\n  const isVocab = mode === "vocab";\n  $("levelSection").hidden = isVocab;\n  $("questionModeSection").hidden = false;\n  $("answerModeSection").hidden = false;\n\n  $("questionModeJaTitle").textContent = isVocab ? "Tiếng Nhật" : "Kanji / tiếng Nhật";\n  $("questionModeJaDesc").textContent = isVocab\n    ? "Hiện từ tiếng Nhật → trả lời nghĩa tiếng Việt."\n    : "Hiện từ tiếng Nhật → trả lời cách đọc furigana.";\n  $("questionModeViTitle").textContent = "Tiếng Việt";\n  $("questionModeViDesc").textContent = isVocab\n    ? "Hiện nghĩa tiếng Việt → trả lời từ tiếng Nhật tương ứng."\n    : "Hiện nghĩa tiếng Việt → trả lời từ tiếng Nhật tương ứng.";\n\n  renderLessonPicker();\n}\n'''
          new_js = '''function syncContentModeAvailability() {\n  const vocabBtn = document.querySelector('.content-mode-btn[data-content-mode="vocab"]');\n  const vocabAvailable = selectedLevel === "N4";\n  if (vocabBtn) {\n    vocabBtn.disabled = !vocabAvailable;\n    vocabBtn.title = vocabAvailable ? "" : `Chưa có dữ liệu từ mới ${selectedLevel}`;\n  }\n  if (!vocabAvailable && contentMode === "vocab") contentMode = "kanji";\n}\n\nfunction setContentMode(mode) {\n  if (mode === "vocab" && selectedLevel !== "N4") return;\n  contentMode = mode;\n  syncContentModeAvailability();\n  document.querySelectorAll(".content-mode-btn").forEach(btn => {\n    btn.classList.toggle("active", btn.dataset.contentMode === contentMode);\n  });\n  const isVocab = contentMode === "vocab";\n  $("levelSection").hidden = false;\n  $("questionModeSection").hidden = false;\n  $("answerModeSection").hidden = false;\n\n  $("questionModeJaTitle").textContent = isVocab ? "Tiếng Nhật" : "Kanji / tiếng Nhật";\n  $("questionModeJaDesc").textContent = isVocab\n    ? "Hiện từ tiếng Nhật → trả lời nghĩa tiếng Việt."\n    : "Hiện từ tiếng Nhật → trả lời cách đọc furigana.";\n  $("questionModeViTitle").textContent = "Tiếng Việt";\n  $("questionModeViDesc").textContent = "Hiện nghĩa tiếng Việt → trả lời từ tiếng Nhật tương ứng.";\n\n  renderLessonPicker();\n}\n'''
          if old_js not in s:
              raise SystemExit('setContentMode block not found')
          s = s.replace(old_js, new_js)

          old_listener = '''document.querySelectorAll(".level-btn").forEach(btn => {\n  btn.addEventListener("click", () => {\n    selectedLevel = btn.dataset.level;\n    document.querySelectorAll(".level-btn").forEach(x => x.classList.remove("active"));\n    btn.classList.add("active");\n    renderLessonPicker();\n  });\n});\n\nsetContentMode("kanji");'''
          new_listener = '''document.querySelectorAll(".level-btn").forEach(btn => {\n  btn.addEventListener("click", () => {\n    if (btn.disabled) return;\n    selectedLevel = btn.dataset.level;\n    document.querySelectorAll(".level-btn").forEach(x => x.classList.remove("active"));\n    btn.classList.add("active");\n    syncContentModeAvailability();\n    setContentMode(contentMode);\n  });\n});\n\nsetContentMode("kanji");'''
          if old_listener not in s:
              raise SystemExit('level listener block not found')
          s = s.replace(old_listener, new_listener)

          assert '0. Chọn cấp độ' in s
          assert '1. Nội dung kiểm tra' in s
          assert s.index('0. Chọn cấp độ') < s.index('1. Nội dung kiểm tra')
          for level in ('N5','N4','N3','N2','N1'):
              assert f'data-level="{level}"' in s
          assert 'Giữ nguyên bài kiểm tra Kanji N5 / N4 hiện tại.' not in s
          assert 'Kiểm tra 184 từ mới theo từng bài, tích hợp từ bộ dữ liệu bạn cung cấp.' not in s
          assert '<strong>Từ mới</strong>' in s
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>([\s\S]*)</script>\s*</body>', s)
          if not m:
              raise SystemExit('script not found')
          Path('/tmp/kanji-app.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/kanji-app.js

      - name: Commit feature and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git rm -- .github/workflows/reorder-level-content.yml
          git commit -m "Put level selection before quiz content"
          git push origin HEAD:reorder-level-content
