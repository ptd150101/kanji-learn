name: Snapshot current N4 vocab
on:
  push:
    branches: [feat/n4-crawl-topics-163]
    paths: ['.github/workflows/snapshot-current-n4-vocab.yml']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out={"kanji_n4":[],"new_vocab_n4":[]}
          d=json.loads(Path('data_n4.json').read_text(encoding='utf-8'))
          out['lessons']=d.get('lessons',{})
          out['kanji_n4']=[{"lesson":x.get('lesson'),"word":x.get('word'),"reading":x.get('reading'),"meaning":x.get('meaning')} for x in d.get('vocab',[])]
          p=Path('vocab_n4_26_31.json')
          if p.exists():
            v=json.loads(p.read_text(encoding='utf-8'))
            out['new_vocab_n4']=[{"lesson":x.get('lesson'),"word":x.get('ja'),"reading":x.get('furigana'),"meaning":x.get('vi')} for x in v]
          Path('analysis').mkdir(exist_ok=True)
          Path('analysis/current_vocab_snapshot.json').write_text(json.dumps(out,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/current_vocab_snapshot.json
          git commit -m 'chore: snapshot current N4 vocabulary for crawl analysis'
          git push
