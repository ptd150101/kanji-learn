name: Summarize crawl analysis
on:
  push:
    branches: [feat/add-crawled-n4-kanji-lessons]
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-crawled-n4-kanji-lessons
      - name: Summarize
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('.tmp/crawl-db-analysis.json')
          rows=json.loads(p.read_text(encoding='utf-8'))
          existing=[]; unmatched=[]
          for r in rows:
            exact_good=[x for x in r['exact'] if x.get('reading_in_answers')]
            item={'id':r['id'],'u':r['u'],'a':r['a'],'s':r['s']}
            if exact_good:
              item['matches']=exact_good
              existing.append(item)
            else:
              item['exact']=r['exact']
              item['sentence_matches']=r['sentence_matches']
              item['same_kanji_signature']=r['same_kanji_signature']
              unmatched.append(item)
          out={'total':len(rows),'existing_exact':len(existing),'unmatched':len(unmatched),'existing':existing,'unmatched_rows':unmatched}
          pathlib.Path('.tmp/crawl-db-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('total',len(rows),'existing',len(existing),'unmatched',len(unmatched))
          PY
      - name: Commit summary and remove workflow
        run: |
          rm -f .github/workflows/summarize-crawl-analysis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/crawl-db-summary.json .github/workflows/summarize-crawl-analysis.yml
          git commit -m "Summarize crawl DB matches"
          git push origin HEAD:feat/add-crawled-n4-kanji-lessons
