name: Validate merged N4 sources
on:
  push:
    branches: [feat/merge-n4-kanji-sources]
    paths:
      - 'data_n4.json'
      - 'data_n5.json'
      - 'han_viet.json'
      - 'index.html'
      - 'data/source_coverage_n4.json'
      - '.github/workflows/validate-merged-n4-sources.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate merged source data
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path

          n4=json.loads(Path('data_n4.json').read_text(encoding='utf-8'))
          n5=json.loads(Path('data_n5.json').read_text(encoding='utf-8'))
          hv=json.loads(Path('han_viet.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/source_coverage_n4.json').read_text(encoding='utf-8'))

          assert n4['total_vocab']==638==len(n4['vocab'])
          assert n5['total_vocab']==369==len(n5['vocab'])
          expected={30:15,31:15,32:15,33:14,34:14,35:14,36:14,37:13}
          for lesson,count in expected.items():
              got=sum(1 for x in n4['vocab'] if x['lesson']==lesson)
              assert got==count,(lesson,got)

          new_rows=[x for x in n4['vocab'] if x['lesson'] in expected]
          new_keys=[(x['word'],x['reading']) for x in new_rows]
          assert len(new_keys)==len(set(new_keys)), 'duplicate word+reading in new N4 lessons'

          must={
            '営業':'えいぎょう','顔':'かお','進む':'すすむ','産む':'うむ','引く':'ひく',
            '貸す':'かす','洗濯':'せんたく','国民':'こくみん','交代':'こうたい',
            '死ぬ':'しぬ','建物':'たてもの','門':'もん','悪い':'わるい'
          }
          byword={x['word']:x['reading'] for x in n4['vocab']}
          for w,r in must.items(): assert byword.get(w)==r,(w,byword.get(w),r)

          target_n5=set('日一国会人年大十二本中長出三時行社見月分後前生五間上東四今新金九入立手学高円子目外言八六下来気小七山話多安女北午百書先名川千道水半男西電口少校語空土木聞食車何南足万店毎白古天買週母火花右読友左休父駅雨飲魚耳')
          target_n4=set('同事自民発者地合市業方回場員開力問代明動京通理体田主題首意不作用度強持野都以思家世区県進正院心界産教文元重近考画海売知集別物引使所品計死特私始朝村運終台広住真有町料工建急止送切説転研究楽起着乗病声質待試族銀早映親験働好英頭低医仕去味門写字答夜音注帰歌光悪図室太歩風紙黒春赤青森館屋色走秋林夏顔短薬習便洋旅軽池服遠夕借曜弱肉貸堂暗鳥飯勉冬昼茶弟洗牛兄犬菜暑妹寒姉漢')
          kr=re.compile(r'[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]')
          chars=set()
          for d in (n5,n4):
              for x in d['vocab']: chars.update(kr.findall(x['word']))
          assert not (target_n5-chars), target_n5-chars
          assert not (target_n4-chars), target_n4-chars

          for ch in chars:
              assert hv.get(ch), f'missing Han-Viet for {ch}'
          for ch in '民業代野以進産引死建門悪顔貸洗':
              assert '/' not in hv[ch], (ch,hv[ch])

          html=Path('index.html').read_text(encoding='utf-8')
          assert '"30":"Công việc & dịch vụ"' in html
          assert '"37":"Trạng thái & ứng xử"' in html
          assert '"営業","reading":"えいぎょう"' in html
          assert '"日本語","reading":"にほんご"' in html

          assert report['sources']['jlpt_n4_past_exam_pdf']['observed_rows']==230
          assert report['additions']['n4_from_pdf']==108
          print('merged-source validation OK')
          PY
      - name: Rebuild SQLite vocabulary database
        run: python scripts/vocab_db.py
      - name: Run importer tests
        run: python -m unittest tests/test_crawl_import.py
      - name: Commit generated database and self-delete workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/validate-merged-n4-sources.yml
          git add data/kanji_vocab.sqlite data/kanji_vocab_stats.json .github/workflows/validate-merged-n4-sources.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: rebuild vocab database after source merge"
            git push
          fi
