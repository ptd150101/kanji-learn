<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kanji N4 Quiz</title>
  <style>
    html,body{height:100%;margin:0;background:#0d1117;color:#f0f6fc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .spin{width:38px;height:38px;border:4px solid #30363d;border-top-color:#58d1c9;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}
    #err{color:#f85149;max-width:760px;white-space:pre-wrap}
  </style>
</head>
<body>
<main><div><div class="spin"></div><h2>Đang tải Kanji N4 Quiz…</h2><div id="err"></div></div></main>
<script>
(async()=>{
  try{
    const parts=[];
    for(let i=0;i<6;i++){
      const name=String(i).padStart(2,'0');
      const r=await fetch(`.upload/payload_part_${name}`,{cache:'no-store'});
      if(!r.ok) throw new Error(`Không tải được payload_part_${name}: HTTP ${r.status}`);
      parts.push((await r.text()).trim());
    }
    const b64=parts.join('');
    const bin=atob(b64);
    const gz=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) gz[i]=bin.charCodeAt(i);
    if(typeof DecompressionStream==='undefined') throw new Error('Trình duyệt chưa hỗ trợ DecompressionStream(gzip). Hãy mở bằng Edge/Chrome mới.');
    const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    const tar=new Uint8Array(await new Response(stream).arrayBuffer());
    const dec=new TextDecoder('utf-8');
    let pos=0, html=null;
    while(pos+512<=tar.length){
      const header=tar.subarray(pos,pos+512);
      if(header.every(v=>v===0)) break;
      const z=header.indexOf(0);
      const name=dec.decode(header.subarray(0,z<0?100:Math.min(z,100)));
      const sizeText=dec.decode(header.subarray(124,136)).replace(/\0/g,'').trim();
      const size=parseInt(sizeText||'0',8);
      const start=pos+512;
      if(name==='index.html') html=dec.decode(tar.subarray(start,start+size));
      pos=start+Math.ceil(size/512)*512;
    }
    if(!html) throw new Error('Không tìm thấy index.html trong payload.');
    document.open(); document.write(html); document.close();
  }catch(e){
    document.querySelector('.spin').style.display='none';
    document.querySelector('#err').textContent='Không thể khởi động website.\n'+(e?.stack||e);
  }
})();
</script>
</body>
</html>
